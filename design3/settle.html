<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=412, initial-scale=1, viewport-fit=cover">
<title>Clay design3 · Settle</title>
<link rel="stylesheet" href="clay3.css">
<style>
.opt{display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);margin:0 16px 8px}
.opt.on{border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
.opt .w{flex:1;font:400 15px var(--sans)}.opt .w b{font-weight:600}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none}
.opt.on .radio{border:7px solid var(--clay)}
.flow{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 4px}
.flow .arr{color:var(--ink3)}
.bigamt{text-align:center;font:500 48px/1.1 var(--serif)}
.edit{display:block;margin:4px auto 0;height:44px;color:var(--lapis);font:600 14px var(--sans)}
.foot{font:400 13px/1.45 var(--sans);color:var(--ink2);text-align:center;padding:10px 28px 0}
</style></head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>

<div class="status"><span class="num">9:41</span><span style="display:flex;gap:6px;align-items:center">
<svg width="17" height="12" viewBox="0 0 17 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3.5H9zM13 11h2V1h-2z" fill="#221C15"/></svg>
<svg width="24" height="12" viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="#221C15" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="#221C15"/></svg></span></div>
<div class="nav"><button class="iconbtn ghost"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button></div>
<div style="padding:0 16px"><h1>Goa Trip</h1></div>
<div class="scrim"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="st" style="height:640px">
 <div class="grab"></div>
 <div class="sh-head"><div><div class="eyebrow">Goa Trip</div><h2 id="st" style="font-size:24px;margin-top:4px">Settle up</h2></div><button class="close" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
 <div class="opt on" role="radio" aria-checked="true"><span class="radio"></span><div class="w num">You pay <b>Arjun</b></div><b class="num owe">₹4,400</b></div>
 <div class="opt" role="radio" aria-checked="false"><span class="radio"></span><div class="w num">You pay <b>Meera</b></div><b class="num owe">₹1,400</b></div>
 <div class="flow"><span class="av c1 lg" aria-hidden="true">AP</span><svg class="ic l arr" aria-hidden="true"><use href="#i-right"/></svg><span class="av c2 lg" aria-hidden="true">AK</span></div>
 <div class="bigamt num">₹4,400</div>
 <button class="edit">Paying part of it? Change amount</button>
 <div style="padding:8px 16px 0"><button class="btn primary block"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>Record ₹4,400 to Arjun</button></div>
 <p class="foot">Goa Trip simplifies debts, so this can differ from your direct balance with Arjun (₹3,000). Your total here stays ₹5,800. Clay only records it; undo for 5 seconds.</p>
</section>
